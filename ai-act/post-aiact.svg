<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <rect width="1200" height="1200" fill="#0F1B2D"/>
  <clipPath id="c"><rect width="1200" height="1200"/></clipPath>
  <g clip-path="url(#c)" opacity="0.12">
    <circle cx="1200" cy="1200" r="900" fill="none" stroke="#E8EDF4" stroke-width="70"/>
    <circle cx="1200" cy="1200" r="680" fill="none" stroke="#E8EDF4" stroke-width="70"/>
    <circle cx="1200" cy="1200" r="460" fill="none" stroke="#E8EDF4" stroke-width="70"/>
    <circle cx="1200" cy="1200" r="240" fill="none" stroke="#E8EDF4" stroke-width="70"/>
  </g>

  <text x="100" y="150" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="700" fill="#A8BBCF" letter-spacing="0.06em">EU AI ACT . ARTIKEL 4</text>
  <line x1="100" y1="185" x2="230" y2="185" stroke="#3B82F6" stroke-width="4"/>

  <text x="100" y="470" font-family="system-ui,-apple-system,sans-serif" font-size="82" font-weight="800" fill="#E8EDF4" letter-spacing="-0.02em">Ihr Team arbeitet</text>
  <text x="100" y="570" font-family="system-ui,-apple-system,sans-serif" font-size="82" font-weight="800" fill="#E8EDF4" letter-spacing="-0.02em">längst mit KI.</text>
  <text x="100" y="700" font-family="system-ui,-apple-system,sans-serif" font-size="82" font-weight="800" fill="#3B82F6" letter-spacing="-0.02em">Nur unsichtbar -</text>
  <text x="100" y="800" font-family="system-ui,-apple-system,sans-serif" font-size="82" font-weight="800" fill="#3B82F6" letter-spacing="-0.02em">und ungeregelt.</text>

  <text x="100" y="960" font-family="system-ui,-apple-system,sans-serif" font-size="34" fill="#6B82A0" letter-spacing="0.01em">Seit Februar 2025 muss jeder Mitarbeiter, der KI nutzt,</text>
  <text x="100" y="1010" font-family="system-ui,-apple-system,sans-serif" font-size="34" fill="#6B82A0" letter-spacing="0.01em">nachweisbar dafür geschult sein. Bei jedem Unternehmen.</text>

  <text x="100" y="1130" font-family="system-ui,-apple-system,sans-serif" font-size="40" font-weight="800" fill="#E8EDF4" letter-spacing="-0.02em">ACSO <tspan fill="#3B82F6">Consulting</tspan></text>
</svg>
